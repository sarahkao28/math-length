<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>長短比一比：車車大車庫挑戰（語音提示進化版）</title>
  <style>
    /* === 1. 全面鎖定 iPad 觸控防滑與全局視覺規範 === */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none; /* 徹底禁用瀏覽器預設滑動與雙指縮放 */
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overscroll-behavior: none; /* 禁用 iOS 橡皮筋回彈 */
      position: fixed; /* 釘死在視窗內 */
      overflow: hidden;
      font-family: 'PingFang TC', 'Microsoft JhengHei', 'Chalkboard SE', 'Comic Sans MS', sans-serif;
      background-color: #FFED99;
      background-image: radial-gradient(#F5C16C 15%, transparent 15%);
      background-size: 25px 25px;
      display: flex;
      flex-direction: column;
    }

    /* 通用卡通粗框按鈕 */
    .cartoon-btn {
      border: 6px solid #333333;
      border-radius: 22px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #333333;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      color: #333333;
    }

    .cartoon-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #333333;
    }

    /* === 2. 頂部標題與指令列（約 10vh） === */
    #top-bar {
      flex: 0 0 10vh;
      min-height: 66px;
      background: #FFFFFF;
      border-bottom: 6px solid #333333;
      padding: 6px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }

    #question-progress {
      background: #FFE082;
      border: 5px solid #333333;
      border-radius: 18px;
      padding: 6px 14px;
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 900;
      color: #333333;
      white-space: nowrap;
    }

    #btn-prompt-voice {
      background: #FFF9C4;
      padding: 6px 18px;
      font-size: clamp(1.15rem, 2.4vw, 1.65rem);
      gap: 8px;
    }

    .badge-long {
      background: #FF5252;
      color: #FFFFFF;
      border: 4px solid #333333;
      border-radius: 14px;
      padding: 2px 12px;
      font-size: 1.15em;
      letter-spacing: 2px;
    }

    .badge-short {
      background: #29B6F6;
      color: #FFFFFF;
      border: 4px solid #333333;
      border-radius: 14px;
      padding: 2px 12px;
      font-size: 1.15em;
    }

    .speaker-pill {
      background: #00E676;
      border: 4px solid #333333;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      margin-left: 4px;
    }

    #btn-settings {
      background: #ECEFF1;
      padding: 8px 16px;
      font-size: clamp(1rem, 1.9vw, 1.3rem);
      gap: 6px;
    }

    /* === 3. 超大柏油路車庫蒐集區（約 19vh） === */
    #garage-section {
      flex: 0 0 19vh;
      min-height: 118px;
      background: #37474F;
      border-bottom: 6px solid #333333;
      padding: 6px 16px 10px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.35);
    }

    .garage-header-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .garage-sign {
      background: #FFD54F;
      color: #333333;
      border: 4px solid #333333;
      border-radius: 12px;
      padding: 1px 12px;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 1px;
    }

    #garage-counter {
      color: #FFE082;
      font-size: 1.05rem;
      font-weight: 900;
    }

    #parking-bays {
      flex: 1;
      display: flex;
      gap: 10px;
      align-items: stretch;
      justify-content: center;
      margin-top: 6px;
    }

    .parking-bay {
      flex: 1;
      max-width: 165px;
      background: #263238;
      border: 4px dashed #FFD54F;
      border-radius: 16px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
    }

    .bay-number {
      position: absolute;
      top: 4px;
      left: 8px;
      font-size: 0.95rem;
      font-weight: 900;
      color: rgba(255, 213, 79, 0.8);
      line-height: 1;
    }

    .parking-bay.occupied {
      border-style: solid;
      border-color: #FFCA28;
      background: radial-gradient(circle at center, #546E7A 0%, #263238 100%);
      box-shadow: 0 0 14px rgba(255, 213, 79, 0.6);
    }

    .parking-bay.occupied .bay-number {
      color: #FFD54F;
    }

    .parked-car-icon {
      font-size: clamp(2.4rem, 6vh, 3.5rem);
      line-height: 1;
      filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.45));
      animation: carParkPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .bay-sparkle {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 1.15rem;
      animation: twinklePulse 1.4s ease-in-out infinite;
    }

    @keyframes carParkPop {
      0% { transform: translateY(-40px) scale(0.3); opacity: 0; }
      70% { transform: translateY(4px) scale(1.15); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes twinklePulse {
      0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.7; }
      50% { transform: scale(1.25) rotate(20deg); opacity: 1; }
    }

    /* === 4. 中央雙選項比較區（彈性佔滿中間空間） === */
    #stage {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      position: relative;
    }

    /* 貫穿上下兩張卡片的紅色垂直起跑線 */
    #continuous-start-line {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 84px;
      width: 10px;
      background: #FF1744;
      border-left: 3px solid #333333;
      border-right: 3px solid #333333;
      border-radius: 5px;
      z-index: 14;
      pointer-events: none;
    }

    #baseline-flag {
      position: absolute;
      top: 4px;
      left: 38px;
      background: #FF1744;
      color: #FFFFFF;
      border: 4px solid #333333;
      border-radius: 12px;
      padding: 1px 10px;
      font-size: 0.95rem;
      font-weight: 900;
      z-index: 16;
      pointer-events: none;
      box-shadow: 0 3px 0 #333333;
    }

    /* 寬敞的白色粗黑框選項卡片 */
    .choice-card {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      background: #FFFFFF;
      border: 7px solid #333333;
      border-radius: 28px;
      box-shadow: 0 8px 0 #333333;
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: transform 0.12s, background-color 0.25s, border-color 0.25s;
      overflow: hidden;
    }

    .choice-card:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #333333;
    }

    /* 物品左端緊貼紅色起跑線向右延伸 */
    .item-holder {
      margin-left: 65px;
      height: 82%;
      display: flex;
      align-items: center;
      position: relative;
      z-index: 6;
      pointer-events: none;
    }

    .item-holder svg {
      height: 100%;
      max-height: 92px;
      width: auto;
      display: block;
    }

    /* === 答題回饋動畫（另一選項絕不變暗） === */
    @keyframes correctGoldGreenBorder {
      0%, 100% {
        border-color: #2E7D32;
        background-color: #E8F5E9;
        box-shadow: 0 8px 0 #2E7D32, 0 0 0 4px rgba(255, 215, 0, 0.5);
      }
      50% {
        border-color: #FFB300;
        background-color: #F1F8E9;
        box-shadow: 0 8px 0 #E65100, 0 0 32px 14px rgba(76, 175, 80, 0.85), inset 0 0 18px rgba(255, 235, 59, 0.75);
      }
    }
    .correct-flash-glow {
      animation: correctGoldGreenBorder 0.9s ease-in-out infinite;
    }

    @keyframes winJump {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-10px) scale(1.02); }
    }
    .win-bounce {
      animation: winJump 0.85s ease-in-out infinite;
    }

    /* 黃色刻度測量尺展開 */
    .ruler-overlay {
      position: absolute;
      bottom: 8px;
      left: 65px;
      height: 22px;
      background: repeating-linear-gradient(
        90deg,
        #FFEB3B,
        #FFEB3B 16px,
        #FBC02D 16px,
        #FBC02D 18px
      );
      border: 3px solid #333333;
      border-radius: 7px;
      z-index: 8;
      width: 0;
      opacity: 0;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: 0.85rem;
      font-weight: 900;
      color: #333333;
    }

    .check-badge {
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      font-size: 3.6rem;
      z-index: 12;
      pointer-events: none;
      filter: drop-shadow(0 4px 0 #333333);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .check-badge.show {
      transform: translateY(-50%) scale(1);
    }

    /* 答錯：輕微左右搖晃 ＋ 正確答案卡片溫和呼吸燈 */
    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-5px); }
    }
    .wrong-shake {
      animation: gentleShake 0.4s ease-in-out;
      background-color: #FFFDE7;
    }

    @keyframes softHintGlow {
      0%, 100% {
        border-color: #333333;
        box-shadow: 0 8px 0 #333333;
      }
      50% {
        border-color: #00C853;
        background-color: #E8F5E9;
        box-shadow: 0 8px 0 #2E7D32, 0 0 24px 8px rgba(0, 230, 118, 0.65);
      }
    }
    .hint-soft-glow {
      animation: softHintGlow 1.1s ease-in-out infinite;
    }

    /* === 5. 獨立底部控制列（僅在「手動按下一題」且答對後顯示，約 11vh） === */
    #bottom-bar {
      flex: 0 0 11vh;
      min-height: 70px;
      background: #FFFFFF;
      border-top: 6px solid #333333;
      padding: 8px 24px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #btn-next-question {
      background: #00E676;
      color: #333333;
      font-size: clamp(1.4rem, 2.8vw, 1.85rem);
      padding: 10px 48px;
      border-radius: 26px;
      width: 100%;
      max-width: 440px;
    }

    /* === 6. 車庫大客滿慶祝彈窗 === */
    #grand-slam-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(51, 51, 51, 0.85);
      z-index: 95;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .grand-slam-card {
      background: #FFFDE7;
      border: 8px solid #333333;
      border-radius: 36px;
      box-shadow: 0 14px 0 #333333;
      padding: 26px 34px;
      max-width: 720px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .grand-slam-title {
      font-size: clamp(1.9rem, 4vw, 2.7rem);
      font-weight: 900;
      color: #E65100;
      margin: 0;
      text-shadow: 2px 2px 0 #FFE082;
    }

    #grand-slam-cars-showcase {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      background: #37474F;
      border: 6px solid #333333;
      border-radius: 24px;
      padding: 18px 24px;
      width: 100%;
    }

    .showcase-car-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #263238;
      border: 4px solid #FFD54F;
      border-radius: 16px;
      padding: 8px 14px;
      min-width: 88px;
    }

    .showcase-car-item span:first-child {
      font-size: 3.2rem;
      line-height: 1.1;
    }

    .showcase-car-item span:last-child {
      font-size: 0.95rem;
      font-weight: 900;
      color: #FFE082;
      margin-top: 4px;
    }

    #btn-play-again {
      background: #FF5252;
      color: #FFFFFF;
      font-size: 1.75rem;
      padding: 14px 44px;
      border-radius: 28px;
    }

    /* === 7. ⚙️ 老師設定後台彈窗 === */
    #settings-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(51, 51, 51, 0.8);
      z-index: 98;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .settings-box {
      background: #FFFFFF;
      border: 7px solid #333333;
      border-radius: 30px;
      box-shadow: 0 12px 0 #333333;
      padding: 20px 26px;
      max-width: 720px;
      width: 100%;
      max-height: 94vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .settings-header {
      font-size: 1.65rem;
      font-weight: 900;
      color: #333333;
      border-bottom: 4px dashed #CFD8DC;
      padding-bottom: 8px;
      margin: 0;
    }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-label {
      font-size: 1.1rem;
      font-weight: 900;
      color: #455A64;
    }

    .option-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill-btn {
      flex: 1;
      min-width: 105px;
      padding: 9px 12px;
      font-size: 1.05rem;
      background: #F5F5F5;
      color: #546E7A;
      border-width: 5px;
      box-shadow: 0 4px 0 #333333;
    }

    .pill-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .pill-btn.selected {
      background: #29B6F6;
      color: #FFFFFF;
    }

    .settings-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 4px dashed #CFD8DC;
    }

    #btn-reset-garage {
      background: #FFCDD2;
      color: #B71C1C;
      padding: 10px 18px;
      font-size: 1.05rem;
    }

    #btn-save-settings {
      background: #00E676;
      color: #333333;
      padding: 12px 30px;
      font-size: 1.25rem;
    }

    .star-particle {
      position: absolute;
      font-size: 2.3rem;
      pointer-events: none;
      z-index: 30;
      animation: starFly 0.95s ease-out forwards;
    }
    @keyframes starFly {
      0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(180deg); opacity: 0; }
    }

    /* 啟動遮罩（解鎖 iPad 語音與音效） */
    #start-splash {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255, 237, 153, 0.98);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    #start-splash h1 {
      font-size: clamp(2rem, 4.5vw, 3rem);
      color: #333333;
      margin: 0;
      text-align: center;
      text-shadow: 3px 3px 0 #FFFFFF;
    }
    #btn-start-game {
      background: #FF5252;
      color: #FFFFFF;
      font-size: 2rem;
      padding: 18px 48px;
      border-radius: 32px;
    }

    @media (max-width: 680px) {
      #stage { padding: 12px 14px; }
      #continuous-start-line { left: 54px; }
      #baseline-flag { left: 14px; font-size: 0.85rem; }
      .item-holder, .ruler-overlay { margin-left: 44px; left: 44px; }
      .parking-bay { border-width: 3px; border-radius: 12px; }
    }
  </style>
</head>
<body>

  <!-- iPad 音訊與語音權限解鎖啟動畫面 -->
  <div id="start-splash">
    <h1>📏 長短比一比 🏎️<br><span style="font-size:0.62em; color:#E65100;">車車大車庫挑戰（語音提示進化版）</span></h1>
    <button id="btn-start-game" class="cartoon-btn" onclick="startApp()">點一下開始挑戰 ▶</button>
  </div>

  <!-- 1. 頂部標題與指令列（約 10vh） -->
  <header id="top-bar">
    <div id="question-progress">第 1 / 5 題</div>

    <button id="btn-prompt-voice" class="cartoon-btn" onclick="repeatPrompt()">
      <span>請選出</span>
      <span id="target-badge" class="badge-long">長長的</span>
      <span class="speaker-pill" title="重聽語音">🔊</span>
    </button>

    <button id="btn-settings" class="cartoon-btn" onclick="openSettings()">⚙️ 老師設定</button>
  </header>

  <!-- 2. 超大柏油路車庫蒐集區（約 19vh） -->
  <section id="garage-section">
    <div class="garage-header-strip">
      <span class="garage-sign">🏁 我的專屬大車庫</span>
      <span id="garage-counter">已蒐集：0 / 5 台車</span>
    </div>
    <div id="parking-bays"></div>
  </section>

  <!-- 3. 中央雙選項比較區（彈性佔滿中間空間） -->
  <main id="stage">
    <div id="baseline-flag">🚩 起跑線</div>
    <div id="continuous-start-line"></div>

    <div id="card-0" class="choice-card" onclick="handleChoice(0)">
      <div id="holder-0" class="item-holder"></div>
      <div id="ruler-0" class="ruler-overlay"></div>
      <div id="check-0" class="check-badge">✅</div>
    </div>

    <div id="card-1" class="choice-card" onclick="handleChoice(1)">
      <div id="holder-1" class="item-holder"></div>
      <div id="ruler-1" class="ruler-overlay"></div>
      <div id="check-1" class="check-badge">✅</div>
    </div>
  </main>

  <!-- 4. 獨立底部控制列（僅在「手動按下一題」且答對後顯示，約 11vh） -->
  <footer id="bottom-bar">
    <button id="btn-next-question" class="cartoon-btn" onclick="nextQuestion()">下一題 ▶</button>
  </footer>

  <!-- 車庫大客滿全破慶祝視窗 -->
  <div id="grand-slam-modal">
    <div class="grand-slam-card">
      <h2 class="grand-slam-title">🏆 車庫大客滿！全部集滿了！ 🏆</h2>
      <div id="grand-slam-cars-showcase"></div>
      <button id="btn-play-again" class="cartoon-btn" onclick="restartFullChallenge()">🔄 再玩一次</button>
    </div>
  </div>

  <!-- ⚙️ 老師設定後台彈窗 -->
  <div id="settings-modal">
    <div class="settings-box">
      <h2 class="settings-header">⚙️ 老師教學參數設定</h2>

      <div class="setting-row">
        <div class="setting-label">1. 練習題型：</div>
        <div class="option-pills" id="opt-target">
          <button class="cartoon-btn pill-btn selected" data-val="long" onclick="selectSetting('target', 'long')">只練【長長的】</button>
          <button class="cartoon-btn pill-btn" data-val="short" onclick="selectSetting('target', 'short')">只練【短的】</button>
          <button class="cartoon-btn pill-btn" data-val="mixed" onclick="selectSetting('target', 'mixed')">長短混合挑戰</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-label">2. 長短差距難度：</div>
        <div class="option-pills" id="opt-gap">
          <button class="cartoon-btn pill-btn selected" data-val="large" onclick="selectSetting('gap', 'large')">差異大（超明顯）</button>
          <button class="cartoon-btn pill-btn" data-val="small" onclick="selectSetting('gap', 'small')">差異小（溫和進階）</button>
          <button class="cartoon-btn pill-btn" data-val="mixed" onclick="selectSetting('gap', 'mixed')">混合難度</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-label">3. 蒐集車車數量（總題數）：</div>
        <div class="option-pills" id="opt-capacity">
          <button class="cartoon-btn pill-btn" data-val="3" onclick="selectSetting('capacity', 3)">3 台</button>
          <button class="cartoon-btn pill-btn selected" data-val="5" onclick="selectSetting('capacity', 5)">5 台</button>
          <button class="cartoon-btn pill-btn" data-val="8" onclick="selectSetting('capacity', 8)">8 台</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-label">4. 換題方式：</div>
        <div class="option-pills" id="opt-advance">
          <button class="cartoon-btn pill-btn selected" data-val="auto" onclick="selectSetting('advance', 'auto')">自動進入下一題</button>
          <button class="cartoon-btn pill-btn" data-val="manual" onclick="selectSetting('advance', 'manual')">手動按下一題</button>
        </div>
      </div>

      <div class="settings-footer">
        <button id="btn-reset-garage" class="cartoon-btn" onclick="resetGarageOnly()">🔄 清空車庫重集</button>
        <button id="btn-save-settings" class="cartoon-btn" onclick="applySettings()">✅ 套用並重新開始</button>
      </div>
    </div>
  </div>

  <script>
    // === 1. iPad 觸控防滑鎖定 ===
    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    // === 2. Web Audio API 音效與 Web Speech API 雙段語音提示系統 ===
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, delay = 0) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const startTime = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      gain.gain.setValueAtTime(0.28, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.stop(startTime + duration);
    }

    function playCorrectCarSound() {
      playTone(523.25, 'triangle', 0.22, 0);    // C5
      playTone(659.25, 'triangle', 0.22, 0.11); // E5
      playTone(783.99, 'triangle', 0.24, 0.22); // G5
      playTone(1046.50, 'triangle', 0.45, 0.34); // C6
    }

    function playGentleWrongSound() {
      playTone(330, 'sine', 0.16, 0);
      playTone(277, 'sine', 0.22, 0.15);
    }

    function playGrandSlamFanfare() {
      playTone(440, 'sawtooth', 0.16, 0);
      playTone(440, 'sawtooth', 0.24, 0.2);
      playTone(523.25, 'triangle', 0.2, 0.5);
      playTone(659.25, 'triangle', 0.2, 0.68);
      playTone(783.99, 'triangle', 0.2, 0.86);
      playTone(1046.50, 'triangle', 0.6, 1.04);
    }

    let speechFallbackTimer = null;
    let autoNextTimer = null;

    function clearSpeechTimers() {
      if (speechFallbackTimer) {
        clearTimeout(speechFallbackTimer);
        speechFallbackTimer = null;
      }
      if (autoNextTimer) {
        clearTimeout(autoNextTimer);
        autoNextTimer = null;
      }
    }

    // 單段語音播放（用於答對獎勵、全破慶祝，支援完整播畢回呼與 5 秒備援）
    function speak(text, onComplete = null, rate = 0.9, pitch = 1.05) {
      if (speechFallbackTimer) {
        clearTimeout(speechFallbackTimer);
        speechFallbackTimer = null;
      }

      let completed = false;
      const triggerComplete = () => {
        if (completed) return;
        completed = true;
        if (speechFallbackTimer) {
          clearTimeout(speechFallbackTimer);
          speechFallbackTimer = null;
        }
        if (typeof onComplete === 'function') {
          onComplete();
        }
      };

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-TW';
        utter.rate = rate;
        utter.pitch = pitch;

        if (onComplete) {
          utter.onend = triggerComplete;
          utter.onerror = triggerComplete;
          speechFallbackTimer = setTimeout(triggerComplete, 5000);
        }

        window.speechSynthesis.speak(utter);
      } else if (onComplete) {
        speechFallbackTimer = setTimeout(triggerComplete, 2000);
      }
    }

    // 雙段對比語音提示：
    // - 長長的：第一段「請選出」(rate 0.9) ➔ 串接第二段「長——，長——，的！」(rate 0.5, pitch 1.05)
    // - 短的：第一段「請選出」(rate 0.9) ➔ 串接第二段「短的！」(rate 1.15, pitch 1.15)
    function speakContrastPrompt(prefixText = '請選出') {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const part1 = new SpeechSynthesisUtterance(prefixText);
      part1.lang = 'zh-TW';
      part1.rate = 0.9;
      part1.pitch = 1.05;

      const part2 = new SpeechSynthesisUtterance(
        currentTarget === 'long' ? '長——，長——，的！' : '短的！'
      );
      part2.lang = 'zh-TW';
      if (currentTarget === 'long') {
        part2.rate = 0.5;
        part2.pitch = 1.05;
      } else {
        part2.rate = 1.15;
        part2.pitch = 1.15;
      }

      part1.onend = () => {
        window.speechSynthesis.speak(part2);
      };
      part1.onerror = () => {
        window.speechSynthesis.speak(part2);
      };

      window.speechSynthesis.speak(part1);
    }

    // === 3. 8 款高對比可愛 SVG 生活物品庫（鉛筆、尺、吸管、牙刷、湯匙、蠟筆、骨頭、小火車） ===
    const itemGenerators = [
      {
        name: '鉛筆',
        render: (w) => {
          const eraserW = 26;
          const metalW = 14;
          const tipW = 36;
          const bodyW = Math.max(18, w - eraserW - metalW - tipW);
          const bx = eraserW + metalW;
          const tx = bx + bodyW;
          return `
            <svg width="${w}" height="86" viewBox="0 0 ${w} 86">
              <rect x="2" y="18" width="${eraserW}" height="50" rx="8" fill="#FF8A80" stroke="#333333" stroke-width="5"/>
              <rect x="${eraserW}" y="18" width="${metalW}" height="50" fill="#CFD8DC" stroke="#333333" stroke-width="5"/>
              <rect x="${bx}" y="18" width="${bodyW}" height="50" fill="#FFD54F" stroke="#333333" stroke-width="5"/>
              <line x1="${bx}" y1="35" x2="${tx}" y2="35" stroke="#FBC02D" stroke-width="4"/>
              <line x1="${bx}" y1="51" x2="${tx}" y2="51" stroke="#FBC02D" stroke-width="4"/>
              <polygon points="${tx},18 ${w - 3},43 ${tx},68" fill="#FFE0B2" stroke="#333333" stroke-width="5" stroke-linejoin="round"/>
              <polygon points="${tx + 21},34 ${w - 3},43 ${tx + 21},52" fill="#333333"/>
            </svg>`;
        }
      },
      {
        name: '尺',
        render: (w) => {
          const innerW = Math.max(40, w - 4);
          let ticks = '';
          for (let tx = 18; tx < innerW - 10; tx += 18) {
            const isMajor = (tx % 36 === 0);
            ticks += `<line x1="${tx}" y1="18" x2="${tx}" y2="${isMajor ? 42 : 32}" stroke="#333333" stroke-width="4" stroke-linecap="round"/>`;
          }
          return `
            <svg width="${w}" height="86" viewBox="0 0 ${w} 86">
              <rect x="2" y="18" width="${innerW}" height="50" rx="8" fill="#4FC3F7" stroke="#333333" stroke-width="5"/>
              ${ticks}
            </svg>`;
        }
      },
      {
        name: '吸管',
        render: (w) => {
          const tipW = 36;
          const flexW = 26;
          const bodyW = Math.max(28, w - tipW - flexW);
          const fx = bodyW;
          const tx = fx + flexW;
          let stripes = '';
          for (let sx = 18; sx < bodyW - 10; sx += 28) {
            stripes += `<rect x="${sx}" y="28" width="12" height="30" fill="#FF5252"/>`;
          }
          return `
            <svg width="${w}" height="86" viewBox="0 0 ${w} 86">
              <rect x="2" y="28" width="${bodyW}" height="30" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="5"/>
              ${stripes}
              <rect x="2" y="28" width="${bodyW}" height="30" rx="4" fill="none" stroke="#333333" stroke-width="5"/>
              <rect x="${fx}" y="26" width="${flexW}" height="34" rx="5" fill="#FFEB3B" stroke="#333333" stroke-width="5"/>
              <line x1="${fx + 8}" y1="26" x2="${fx + 8}" y2="60" stroke="#333333" stroke-width="3"/>
              <line x1="${fx + 17}" y1="26" x2="${fx + 17}" y2="60" stroke="#333333" stroke-width="3"/>
              <rect x="${tx}" y="28" width="${tipW - 2}" height="30" rx="4" fill="#FF5252" stroke="#333333" stroke-width="5"/>
            </svg>`;
        }
      },
      {
        name: '牙刷',
        render: (w) => {
          const headW = 54;
          const handleW = Math.max(36, w - headW);
          const hx = handleW - 4;
          return `
            <svg width="${w}" height="86" viewBox="0 0 ${w} 86">
              <rect x="${hx + 6}" y="12" width="42" height="30" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="5"/>
              <line x1="${hx + 17}" y1="12" x2="${hx + 17}" y2="40" stroke="#42A5F5" stroke-width="4"/>
              <line x1="${hx + 27}" y1="12" x2="${hx + 27}" y2="40" stroke="#42A5F5" stroke-width="4"/>
              <line x1="${hx + 37}" y1="12" x2="${hx + 37}" y2="40" stroke="#42A5F5" stroke-width="4"/>
              <rect x="${hx}" y="40" width="${headW}" height="24" rx="11" fill="#FF7043" stroke="#333333" stroke-width="5"/>
              <rect x="2" y="42" width="${handleW}" height="22" rx="11" fill="#FF7043" stroke="#333333" stroke-width="5"/>
              <circle cx="18" cy="53" r="4.5" fill="#FFFFFF"/>
            </svg>`;
        }
      },
      {
        name: '湯匙',
        render: (w) => {
          const bowlW = 64;
          const handleW = Math.max(32, w - bowlW + 8);
          const bx = handleW - 6 + bowlW / 2;
          return `
            <svg width="${w}" height="86" viewBox="0 0 ${w} 86">
              <rect x="2" y="33" width="${handleW}" height="20" rx="10" fill="#B0BEC5" stroke="#333333" stroke-width="5"/>
              <ellipse cx="${bx}" cy="43" rx="${bowlW / 2}" ry="24" fill="#ECEFF1" stroke="#333333" stroke-width="5"/>
              <ellipse cx="${bx + 3}" cy="43" rx="${bowlW / 2 - 11}" ry="13" fill="#CFD8DC"/>
            </svg>`;
        }
      },
      {
        name: '蠟筆',
        render: (w) => {
          const tipW = 34;
          const bodyW = Math.max(46, w - tipW);
          const bandOffset = Math.min(20, Math.floor(bodyW * 0.22));
          return `
            <svg width="${w}" height="86" viewBox="0 0 ${w} 86">
              <rect x="2" y="18" width="${bodyW}" height="50" rx="8" fill="#AB47BC" stroke="#333333" stroke-width="5"/>
              <rect x="${2 + bandOffset}" y="18" width="${Math.max(16, bodyW - bandOffset * 2)}" height="50" fill="#F3E5F5" stroke="#333333" stroke-width="4"/>
              <line x1="${2 + bandOffset + 6}" y1="18" x2="${2 + bandOffset + 6}" y2="68" stroke="#333333" stroke-width="4"/>
              <line x1="${bodyW - bandOffset - 4}" y1="18" x2="${bodyW - bandOffset - 4}" y2="68" stroke="#333333" stroke-width="4"/>
              <path d="M ${bodyW} 24 L ${w - 8} 34 Q ${w} 43 ${w - 8} 52 L ${bodyW} 62 Z" fill="#8E24AA" stroke="#333333" stroke-width="5" stroke-linejoin="round"/>
            </svg>`;
        }
      },
      {
        name: '骨頭',
        render: (w) => {
          const knobR = 14;
          const leftX = knobR + 4;
          const rightX = Math.max(leftX + 36, w - knobR - 4);
          return `
            <svg width="${w}" height="86" viewBox="0 0 ${w} 86">
              <rect x="${leftX}" y="31" width="${rightX - leftX}" height="24" fill="#FFF8E1" stroke="#333333" stroke-width="5"/>
              <circle cx="${leftX}" cy="28" r="${knobR}" fill="#FFF8E1" stroke="#333333" stroke-width="5"/>
              <circle cx="${leftX}" cy="58" r="${knobR}" fill="#FFF8E1" stroke="#333333" stroke-width="5"/>
              <circle cx="${rightX}" cy="28" r="${knobR}" fill="#FFF8E1" stroke="#333333" stroke-width="5"/>
              <circle cx="${rightX}" cy="58" r="${knobR}" fill="#FFF8E1" stroke="#333333" stroke-width="5"/>
              <rect x="${leftX - 4}" y="33.5" width="${rightX - leftX + 8}" height="19" fill="#FFF8E1"/>
            </svg>`;
        }
      },
      {
        name: '小火車',
        render: (w) => {
          const engineW = 66;
          const coachArea = Math.max(0, w - engineW - 8);
          const coachCount = Math.floor(coachArea / 54);
          let coaches = '';
          let wheels = '';
          let curX = 2;

          for (let i = 0; i < coachCount; i++) {
            const cw = 46;
            const color = i % 2 === 0 ? '#4FC3F7' : '#81C784';
            coaches += `
              <line x1="${curX + cw}" y1="54" x2="${curX + cw + 8}" y2="54" stroke="#333333" stroke-width="5"/>
              <rect x="${curX}" y="26" width="${cw}" height="38" rx="8" fill="${color}" stroke="#333333" stroke-width="5"/>
              <rect x="${curX + 9}" y="34" width="11" height="12" rx="3" fill="#FFF9C4" stroke="#333333" stroke-width="3"/>
              <rect x="${curX + 26}" y="34" width="11" height="12" rx="3" fill="#FFF9C4" stroke="#333333" stroke-width="3"/>
            `;
            wheels += `
              <circle cx="${curX + 12}" cy="69" r="8" fill="#546E7A" stroke="#333333" stroke-width="4"/>
              <circle cx="${curX + cw - 12}" cy="69" r="8" fill="#546E7A" stroke="#333333" stroke-width="4"/>
            `;
            curX += cw + 8;
          }

          const ex = curX;
          const ew = Math.max(58, w - ex - 2);
          return `
            <svg width="${w}" height="86" viewBox="0 0 ${w} 86">
              ${coaches}
              <!-- 紅色火車頭（右端） -->
              <rect x="${ex + ew - 24}" y="10" width="12" height="18" rx="3" fill="#FFD54F" stroke="#333333" stroke-width="4"/>
              <rect x="${ex}" y="16" width="28" height="48" rx="7" fill="#FF5252" stroke="#333333" stroke-width="5"/>
              <rect x="${ex + 22}" y="28" width="${ew - 22}" height="36" rx="8" fill="#FF5252" stroke="#333333" stroke-width="5"/>
              <rect x="${ex + 6}" y="23" width="15" height="15" rx="3" fill="#FFF9C4" stroke="#333333" stroke-width="3"/>
              ${wheels}
              <circle cx="${ex + 14}" cy="69" r="9" fill="#FFD54F" stroke="#333333" stroke-width="4"/>
              <circle cx="${ex + ew - 14}" cy="69" r="9" fill="#FFD54F" stroke="#333333" stroke-width="4"/>
            </svg>`;
        }
      }
    ];

    // === 4. 車庫車隊清單（8 款可愛車輛） ===
    const carFleet = [
      { emoji: '🚗', name: '紅色小汽車' },
      { emoji: '🚒', name: '英勇消防車' },
      { emoji: '🚓', name: '閃亮警車' },
      { emoji: '🚑', name: '白色救護車' },
      { emoji: '🚌', name: '黃色大公車' },
      { emoji: '🚜', name: '大力挖土機' },
      { emoji: '🏎️', name: '超酷跑車' },
      { emoji: '🚚', name: '藍色大卡車' }
    ];

    // === 5. 遊戲狀態與老師設定 ===
    const config = {
      targetMode: 'long',    // 'long' (預設) | 'short' | 'mixed'
      gapMode: 'large',      // 'large' (82% vs 24%，預設) | 'small' (76% vs 42%) | 'mixed'
      garageCapacity: 5,     // 3, 5 (預設), 8
      advanceMode: 'auto'    // 'auto' (預設) | 'manual'
    };

    let tempConfig = { ...config };
    let currentTarget = 'long';
    let longCardIndex = 0;
    let currentItemIdx = -1;
    let isAnswered = false;
    let collectedCars = [];

    function startApp() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.getElementById('start-splash').style.display = 'none';
      renderGarage();
      nextQuestion();
    }

    function updateProgressIndicator() {
      const currentNum = Math.min(collectedCars.length + 1, config.garageCapacity);
      document.getElementById('question-progress').innerText = `第 ${currentNum} / ${config.garageCapacity} 題`;
    }

    // === 車庫繪製與更新 ===
    function renderGarage() {
      const baysContainer = document.getElementById('parking-bays');
      const counterEl = document.getElementById('garage-counter');
      counterEl.innerText = `已蒐集：${collectedCars.length} / ${config.garageCapacity} 台車`;
      updateProgressIndicator();

      baysContainer.innerHTML = '';
      for (let i = 0; i < config.garageCapacity; i++) {
        const bay = document.createElement('div');
        const car = collectedCars[i];
        bay.className = 'parking-bay' + (car ? ' occupied' : '');
        bay.innerHTML = `<span class="bay-number">${i + 1}</span>`;
        if (car) {
          bay.innerHTML += `
            <span class="bay-sparkle">✨</span>
            <span class="parked-car-icon" title="${car.name}">${car.emoji}</span>
          `;
        }
        baysContainer.appendChild(bay);
      }
    }

    // === 後台「⚙️ 老師設定」控制 ===
    function openSettings() {
      clearSpeechTimers();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      tempConfig = { ...config };
      refreshSettingsPills();
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function selectSetting(category, value) {
      if (category === 'target') tempConfig.targetMode = value;
      if (category === 'gap') tempConfig.gapMode = value;
      if (category === 'capacity') tempConfig.garageCapacity = Number(value);
      if (category === 'advance') tempConfig.advanceMode = value;
      refreshSettingsPills();
    }

    function refreshSettingsPills() {
      document.querySelectorAll('#opt-target .pill-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.val === tempConfig.targetMode);
      });
      document.querySelectorAll('#opt-gap .pill-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.val === tempConfig.gapMode);
      });
      document.querySelectorAll('#opt-capacity .pill-btn').forEach(btn => {
        btn.classList.toggle('selected', Number(btn.dataset.val) === tempConfig.garageCapacity);
      });
      document.querySelectorAll('#opt-advance .pill-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.val === tempConfig.advanceMode);
      });
    }

    function resetGarageOnly() {
      collectedCars = [];
      renderGarage();
      playGentleWrongSound();
    }

    function applySettings() {
      config.targetMode = tempConfig.targetMode;
      config.gapMode = tempConfig.gapMode;
      config.garageCapacity = tempConfig.garageCapacity;
      config.advanceMode = tempConfig.advanceMode;

      collectedCars = [];
      renderGarage();
      document.getElementById('settings-modal').style.display = 'none';
      nextQuestion();
    }

    function repeatPrompt() {
      speakContrastPrompt('請選出');
    }

    // === 出題邏輯 ===
    function nextQuestion() {
      clearSpeechTimers();
      isAnswered = false;
      updateProgressIndicator();

      document.getElementById('bottom-bar').style.display = 'none';

      // 1. 決定本題目標（長長的 / 短的）
      if (config.targetMode === 'mixed') {
        currentTarget = Math.random() < 0.5 ? 'long' : 'short';
      } else {
        currentTarget = config.targetMode;
      }

      // 2. 挑選不連續重複的生活物品
      let nextIdx = Math.floor(Math.random() * itemGenerators.length);
      if (nextIdx === currentItemIdx) {
        nextIdx = (nextIdx + 1) % itemGenerators.length;
      }
      currentItemIdx = nextIdx;
      const generator = itemGenerators[currentItemIdx];

      // 更新頂部指導語色塊
      const badgeEl = document.getElementById('target-badge');
      if (currentTarget === 'long') {
        badgeEl.innerText = '長長的';
        badgeEl.className = 'badge-long';
      } else {
        badgeEl.innerText = '短的';
        badgeEl.className = 'badge-short';
      }

      // 3. 決定長短差距比例（差異大 82% vs 24%；差異小溫和進階 76% vs 42%）
      let activeGap = config.gapMode;
      if (activeGap === 'mixed') {
        activeGap = Math.random() < 0.5 ? 'large' : 'small';
      }
      const longRatio = (activeGap === 'large') ? 0.82 : 0.76;
      const shortRatio = (activeGap === 'large') ? 0.24 : 0.42;

      // 4. 隨機決定長物品在上方 (0) 或下方 (1)
      longCardIndex = Math.random() < 0.5 ? 0 : 1;

      // 5. 依據舞台寬度計算精準像素長度
      const stageWidth = document.getElementById('stage').clientWidth;
      const trackWidth = Math.max(280, stageWidth - 135);
      const longWidth = Math.floor(trackWidth * longRatio);
      const shortWidth = Math.max(96, Math.floor(trackWidth * shortRatio));

      for (let i = 0; i < 2; i++) {
        const card = document.getElementById(`card-${i}`);
        const holder = document.getElementById(`holder-${i}`);
        const ruler = document.getElementById(`ruler-${i}`);
        const check = document.getElementById(`check-${i}`);

        card.className = 'choice-card';
        holder.className = 'item-holder';
        check.className = 'check-badge';
        ruler.style.width = '0px';
        ruler.style.opacity = '0';
        ruler.innerText = '';

        const w = (i === longCardIndex) ? longWidth : shortWidth;
        holder.innerHTML = generator.render(w);
        holder.dataset.width = w;
      }

      speakContrastPrompt('請選出');
    }

    // === 作答判定與無遮蔽比對回饋 ===
    function handleChoice(cardIdx) {
      if (isAnswered) return;

      const isLongCard = (cardIdx === longCardIndex);
      const isCorrect = (currentTarget === 'long' && isLongCard) || (currentTarget === 'short' && !isLongCard);
      const correctCardIdx = (currentTarget === 'long') ? longCardIndex : (1 - longCardIndex);

      if (isCorrect) {
        isAnswered = true;
        playCorrectCarSound();

        const winCard = document.getElementById(`card-${cardIdx}`);
        const winHolder = document.getElementById(`holder-${cardIdx}`);
        const winCheck = document.getElementById(`check-${cardIdx}`);

        // 正確選項綠金色粗框閃爍，另一張卡片完全保持清晰不變暗
        winCard.classList.remove('hint-soft-glow');
        winCard.classList.add('correct-flash-glow');
        winHolder.classList.add('win-bounce');
        winCheck.classList.add('show');

        // 展開黃色刻度測量尺，方便師生比對
        for (let i = 0; i < 2; i++) {
          const w = document.getElementById(`holder-${i}`).dataset.width;
          const ruler = document.getElementById(`ruler-${i}`);
          ruler.style.opacity = '1';
          ruler.style.width = `${w}px`;
          ruler.innerText = (i === longCardIndex) ? '長長的' : '短的';
        }

        spawnStars(winCard);

        // 獲得一台新車停入車庫
        const newCar = carFleet[collectedCars.length % carFleet.length];
        collectedCars.push(newCar);
        renderGarage();

        const rewardSpeech = `答對了！得到一台${newCar.name}！`;

        // 檢查車庫是否全部停滿
        if (collectedCars.length >= config.garageCapacity) {
          speak(rewardSpeech, () => {
            autoNextTimer = setTimeout(() => {
              showGrandSlamModal();
            }, 800);
          });
        } else {
          if (config.advanceMode === 'auto') {
            speak(rewardSpeech, () => {
              autoNextTimer = setTimeout(() => {
                nextQuestion();
              }, 800);
            });
          } else {
            speak(rewardSpeech);
            document.getElementById('bottom-bar').style.display = 'flex';
          }
        }

      } else {
        // 答錯：溫和提示音 ＋ 輕微搖晃 ＋ 正確答案卡片溫和呼吸燈 ＋ 聲音拉長對比提示
        playGentleWrongSound();

        const wrongCard = document.getElementById(`card-${cardIdx}`);
        const hintCard = document.getElementById(`card-${correctCardIdx}`);

        wrongCard.classList.remove('wrong-shake');
        void wrongCard.offsetWidth;
        wrongCard.classList.add('wrong-shake');

        hintCard.classList.add('hint-soft-glow');

        speakContrastPrompt('再看看喔，找出');
      }
    }

    // === 車庫大客滿全破慶祝視窗 ===
    function showGrandSlamModal() {
      const showcase = document.getElementById('grand-slam-cars-showcase');
      showcase.innerHTML = collectedCars.map(car => `
        <div class="showcase-car-item">
          <span>${car.emoji}</span>
          <span>${car.name}</span>
        </div>
      `).join('');

      document.getElementById('grand-slam-modal').style.display = 'flex';
      playGrandSlamFanfare();
      speak('太厲害了！車庫大客滿！全部集滿了！');
    }

    function restartFullChallenge() {
      document.getElementById('grand-slam-modal').style.display = 'none';
      collectedCars = [];
      renderGarage();
      nextQuestion();
    }

    function spawnStars(targetEl) {
      const rect = targetEl.getBoundingClientRect();
      const stars = ['⭐', '🌟', '✨', '🎉'];
      for (let i = 0; i < 12; i++) {
        const star = document.createElement('div');
        star.className = 'star-particle';
        star.innerText = stars[i % stars.length];
        star.style.left = `${rect.left + rect.width * (0.2 + Math.random() * 0.6)}px`;
        star.style.top = `${rect.top + rect.height * 0.45}px`;
        const tx = (Math.random() - 0.5) * 260;
        const ty = -70 - Math.random() * 130;
        star.style.setProperty('--tx', `${tx}px`);
        star.style.setProperty('--ty', `${ty}px`);
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 950);
      }
    }
  </script>
</body>
</html>
